<html>
  <head>
    <title>web page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Nikhitha's Web Page</p>
    <p>username</p>
    <input id="nameInput" />
    <p>password</p>
    <input id="passwordInput" />
    <button onclick="webPage()">login</button>
    <p id="message"></p>

    <p id="description">
      This is my personal web page. It contains some information about me. I
      also added my projects and skills. It is simple and easy to use.
    </p>
    <p>enter your color</p>
    <input id="colorInput" />
    <button onclick="discriptionColorChange()">Apply</button>

    <button onclick="fetchStudents()">Fetch Student list</button>
    <p>Student List</p>
    <p id="stud"></p>

    <script>
      async function fetchStudents() {
        const url = "http://localhost:8000/studentlist";

        try {
          const response = await fetch(url);

          // 2. Always check if the HTTP status code is successful (200-299)
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }

          // 3. Parse the data stream into JSON
          const data = await response.json();
          console.log("Success tgeehet:", data);
          let students=""
          for (let i = 0; i <data.length; i++){
            console.log(data[i])
            students = students + data[i] + "<br>";
          }
          document.getElementById("stud").innerHTML = students;
        } catch (error) {
          // Catch network failures or parsing issues
          console.error("Failed to fetch local data:", error);
        }
      }

      function webPage() {
        const actualUsername = "Jackson";
        const actualPassword = "1234";
        var input1 = document.getElementById("nameInput").value;
        console.log(input1);
        var input2 = document.getElementById("passwordInput").value;
        console.log(input2);
        if (input1 == actualUsername && input2 == actualPassword) {
          console.log("username is correct");
          document.getElementById("message").textContent =
            "username is correct";
          document.getElementById("message").style.color = "green";
        } else {
          console.log("username is incorrect");
          document.getElementById("message").textContent =
            "username is incorrect";
          document.getElementById("message").style.color = "red";
        }
      }
      function discriptionColorChange() {
        var input1 = document.getElementById("colorInput").value;
        console.log(input1);
        var input2 = document.getElementById("description").value;
        console.log(input2);
        document.getElementById("description").style.color = input1;
      }
    </script>
  </body>
</html>
